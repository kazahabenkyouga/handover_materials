<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業務引き継ぎ資料</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <nav id="navigation"></nav>
        <main id="main-content">
            <div id="loading">読み込み中...</div>
        </main>
    </div>
    <!--
      SharePoint上では <script type="module"> が MIME / セキュリティ設定でブロックされることがあります。
      互換性を優先して通常のscriptで読み込みます（本アプリはimport/export未使用のため問題ありません）。
    -->
    <script>
      // app.js が読み込めない/実行されない場合に「読み込み中…」で固まるため、ガイドを表示する
      window.__handoverAppStarted = false;
      window.setTimeout(() => {
        if (window.__handoverAppStarted) return;
        const main = document.getElementById('main-content');
        if (!main) return;
        main.innerHTML = `
          <div class="content-page">
            <h1>読み込みが止まる場合の確認</h1>
            <p class="description">JavaScript または JSON の読み込みがブロックされている可能性があります。</p>
            <h2>よくある原因</h2>
            <ul>
              <li><strong>SharePointの設定で .js の実行が制限</strong>（拡張子の扱い / MIME / セキュリティ）</li>
              <li><strong>同じフォルダ構成になっていない</strong>（<code>js/app.js</code> や <code>data/content.json</code> が別階層）</li>
              <li><strong>ローカルの file:// で開いている</strong>（ブラウザが fetch をブロックすることがあります）</li>
            </ul>
            <h2>確認方法</h2>
            <ul>
              <li>ブラウザの開発者ツール(Console/Network)で <code>app.js</code> と <code>content.json</code> が 200 で取得できているか確認</li>
            </ul>
          </div>
        `;
      }, 1200);
    </script>
    <script src="js/app.js" defer></script>
</body>
</html>
